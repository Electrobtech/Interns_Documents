services:

  # ─────────────────────────────────────────────
  # Infrastructure Services
  # ─────────────────────────────────────────────

  # PostgreSQL with pgvector extension for vector embeddings
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-lead}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leadpass}
      POSTGRES_DB:       ${POSTGRES_DB:-lead_automation}
      # Non-superuser role every service actually connects as — see
      # infra/db/00-app-role.sh / infra/db/rls.sql / docs/MULTI_TENANT_RLS.md.
      APP_DB_USER:       ${APP_DB_USER:-app_user}
      APP_DB_PASSWORD:   ${APP_DB_PASSWORD:-apppass}
    # Host port 5435 — native Windows Postgres already occupies 5432.
    # Container-internal traffic still uses postgres:5432.
    ports: ["5435:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      # docker-entrypoint-initdb.d scripts run in filename order:
      #   00 - create the non-superuser app_user role (RLS is never
      #        enforced against a table owner or a superuser, so this has
      #        to exist and be used by services for RLS to do anything)
      #   01 - base schema (tables, including organization_id columns)
      #   02 - seed data (loaded as the owner, before RLS is enabled below)
      #   03 - enable + force RLS and create the tenant_isolation policies
      - ./infra/db/00-app-role.sh:/docker-entrypoint-initdb.d/00-app-role.sh
      - ./infra/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./infra/db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
      - ./infra/db/rls.sql:/docker-entrypoint-initdb.d/03-rls.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lead} -d ${POSTGRES_DB:-lead_automation}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Redis for caching and session management
  redis:
    image: redis:7-alpine
    # Host port 6380 — the other checkout already binds 6379.
    ports: ["6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Ollama for local LLM inference (fallback when Groq API unavailable)
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    # Host port 11435 — native Ollama install already binds 11434.
    ports: ["11435:11434"]
    volumes:
      - ollama:/root/.ollama

  # ─────────────────────────────────────────────
  # Backend Micro-Services (Node.js)
  # ─────────────────────────────────────────────

  # Authentication service - handles user login, registration, JWT tokens
  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
      network: host
    env_file: .env
    environment:
      DATABASE_URL: postgres://${APP_DB_USER:-app_user}:${APP_DB_PASSWORD:-apppass}@postgres:5432/${POSTGRES_DB:-lead_automation}
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["4001:4001"]
    # Persists uploaded logos/certificates (see companyController.js) across
    # container restarts/rebuilds. Local-disk-only, same caveat as
    # automation_uploads below — swap for S3 before scaling to >1 replica.
    volumes:
      - auth_uploads:/app/services/auth-service/public/uploads

  # Contact service - manages customer contacts and CRM data
  contact-service:
    build:
      context: .
      dockerfile: services/contact-service/Dockerfile
      network: host
    env_file: .env
    environment:
      DATABASE_URL: postgres://${APP_DB_USER:-app_user}:${APP_DB_PASSWORD:-apppass}@postgres:5432/${POSTGRES_DB:-lead_automation}
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["4003:4003"]

  # Campaign service - handles marketing campaigns and outreach
  campaign-service:
    build:
      context: .
      dockerfile: services/campaign-service/Dockerfile
      network: host
    env_file: .env
    environment:
      DATABASE_URL: postgres://${APP_DB_USER:-app_user}:${APP_DB_PASSWORD:-apppass}@postgres:5432/${POSTGRES_DB:-lead_automation}
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    ports: ["4004:4004"]

  # AI Agent Overview service - Python/FastAPI for Overview and orchestration
  ai-overview-service:
    build:
      context: .
      dockerfile: ai-agent-backend/Dockerfile
      network: host
    container_name: ai-overview-service
    env_file: .env
    environment:
      # NOTE: still connects as the admin/migration role, not app_user. This
      # service's SQLAlchemy models (ai_agents/ai_suggestions-equivalent
      # tables) aren't part of infra/db/rls.sql yet and it has no
      # per-request tenant-scoping layer analogous to shared/src/db.js —
      # see docs/MULTI_TENANT_RLS.md's known-gaps note. Tracked as follow-up.
      DATABASE_URL:          postgresql+asyncpg://${POSTGRES_USER:-lead}:${POSTGRES_PASSWORD:-leadpass}@postgres:5432/${POSTGRES_DB:-lead_automation}
      JWT_SECRET:            ${JWT_SECRET:-change-me-in-prod}
      LLM_PROVIDER:          ${LLM_PROVIDER:-groq}
      LLM_FALLBACK_PROVIDER: ${LLM_FALLBACK_PROVIDER:-ollama}
      GROQ_API_KEY:          ${GROQ_API_KEY}
      GROQ_BASE_URL:         ${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      GROQ_MODEL:            ${GROQ_MODEL:-llama-3.3-70b-versatile}
      OLLAMA_HOST:           http://ollama:11434
      OLLAMA_MODEL:          ${OLLAMA_MODEL:-qwen3:8b}
      EMBEDDING_MODEL:       ${EMBEDDING_MODEL:-nomic-embed-text}
      CONTACT_SERVICE_URL:   http://contact-service:4003
      CAMPAIGN_SERVICE_URL:  http://campaign-service:4004
    depends_on:
      postgres: { condition: service_healthy }
      ollama:   { condition: service_started }
    ports: ["4020:4020"]
    volumes:
      - ./ai-agent-backend/entrypoint-overview.sh:/app/entrypoint-overview.sh
    entrypoint: ["./entrypoint-overview.sh"]

  # AI Agent Marketing service - Python/FastAPI for Marketing agent
  ai-marketing-service:
    build:
      context: .
      dockerfile: ai-agent-backend/Dockerfile
      network: host
    container_name: ai-marketing-service
    env_file: .env
    environment:
      DATABASE_URL:          postgresql+asyncpg://${POSTGRES_USER:-lead}:${POSTGRES_PASSWORD:-leadpass}@postgres:5432/${POSTGRES_DB:-lead_automation}
      JWT_SECRET:            ${JWT_SECRET:-change-me-in-prod}
      LLM_PROVIDER:          ${LLM_PROVIDER:-groq}
      LLM_FALLBACK_PROVIDER: ${LLM_FALLBACK_PROVIDER:-ollama}
      GROQ_API_KEY:          ${GROQ_API_KEY}
      GROQ_BASE_URL:         ${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      GROQ_MODEL:            ${GROQ_MODEL:-llama-3.3-70b-versatile}
      OLLAMA_HOST:           http://ollama:11434
      OLLAMA_MODEL:          ${OLLAMA_MODEL:-qwen3:8b}
      EMBEDDING_MODEL:       ${EMBEDDING_MODEL:-nomic-embed-text}
      CONTACT_SERVICE_URL:   http://contact-service:4003
      CAMPAIGN_SERVICE_URL:  http://campaign-service:4004
    depends_on:
      postgres: { condition: service_healthy }
      ollama:   { condition: service_started }
    ports: ["4021:4021"]
    volumes:
      - ./ai-agent-backend/entrypoint-marketing.sh:/app/entrypoint-marketing.sh
    entrypoint: ["./entrypoint-marketing.sh"]

  # AI Agent Sales service - Python/FastAPI for Sales agent
  ai-sales-service:
    build:
      context: .
      dockerfile: ai-agent-backend/Dockerfile
      network: host
    container_name: ai-sales-service
    env_file: .env
    environment:
      DATABASE_URL:          postgresql+asyncpg://${POSTGRES_USER:-lead}:${POSTGRES_PASSWORD:-leadpass}@postgres:5432/${POSTGRES_DB:-lead_automation}
      JWT_SECRET:            ${JWT_SECRET:-change-me-in-prod}
      LLM_PROVIDER:          ${LLM_PROVIDER:-groq}
      LLM_FALLBACK_PROVIDER: ${LLM_FALLBACK_PROVIDER:-ollama}
      GROQ_API_KEY:          ${GROQ_API_KEY}
      GROQ_BASE_URL:         ${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      GROQ_MODEL:            ${GROQ_MODEL:-llama-3.3-70b-versatile}
      OLLAMA_HOST:           http://ollama:11434
      OLLAMA_MODEL:          ${OLLAMA_MODEL:-qwen3:8b}
      EMBEDDING_MODEL:       ${EMBEDDING_MODEL:-nomic-embed-text}
      CONTACT_SERVICE_URL:   http://contact-service:4003
      CAMPAIGN_SERVICE_URL:  http://campaign-service:4004
    depends_on:
      postgres: { condition: service_healthy }
      ollama:   { condition: service_started }
    ports: ["4022:4022"]
    volumes:
      - ./ai-agent-backend/entrypoint-sales.sh:/app/entrypoint-sales.sh
    entrypoint: ["./entrypoint-sales.sh"]

  # AI Agent Support service - Python/FastAPI for Support agent
  ai-support-service:
    build:
      context: .
      dockerfile: ai-agent-backend/Dockerfile
      network: host
    container_name: ai-support-service
    env_file: .env
    environment:
      DATABASE_URL:          postgresql+asyncpg://${POSTGRES_USER:-lead}:${POSTGRES_PASSWORD:-leadpass}@postgres:5432/${POSTGRES_DB:-lead_automation}
      JWT_SECRET:            ${JWT_SECRET:-change-me-in-prod}
      LLM_PROVIDER:          ${LLM_PROVIDER:-groq}
      LLM_FALLBACK_PROVIDER: ${LLM_FALLBACK_PROVIDER:-ollama}
      GROQ_API_KEY:          ${GROQ_API_KEY}
      GROQ_BASE_URL:         ${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      GROQ_MODEL:            ${GROQ_MODEL:-llama-3.3-70b-versatile}
      OLLAMA_HOST:           http://ollama:11434
      OLLAMA_MODEL:          ${OLLAMA_MODEL:-qwen3:8b}
      EMBEDDING_MODEL:       ${EMBEDDING_MODEL:-nomic-embed-text}
      CONTACT_SERVICE_URL:   http://contact-service:4003
      CAMPAIGN_SERVICE_URL:  http://campaign-service:4004
    depends_on:
      postgres: { condition: service_healthy }
      ollama:   { condition: service_started }
    ports: ["4023:4023"]
    volumes:
      - ./ai-agent-backend/entrypoint-support.sh:/app/entrypoint-support.sh
    entrypoint: ["./entrypoint-support.sh"]

  # Billing service - Razorpay payment gateway: wallet recharge
  # (campaigns/broadcasts), product-platform checkout, and walk-in POS
  # (cash or QR/payment-link).
  billing-service:
    build:
      context: .
      dockerfile: services/billing-service/Dockerfile
      network: host
    env_file: .env
    environment:
      PORT: 4015
      DATABASE_URL: postgres://${APP_DB_USER:-app_user}:${APP_DB_PASSWORD:-apppass}@postgres:5432/${POSTGRES_DB:-lead_automation}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["4015:4015"]

  # Marketing Hub service - Assets Library (upload/list/delete) and future
  # Marketing Hub backend routes. Files land under public/uploads/marketing-assets;
  # GATEWAY_PUBLIC_URL is used so returned storage_url resolves via the gateway.
  marketing-hub-service:
    build:
      context: .
      dockerfile: services/marketing-hub-service/Dockerfile
      network: host
    env_file: .env
    environment:
      MARKETING_HUB_PORT: "4016"
      DATABASE_URL: postgres://${APP_DB_USER:-app_user}:${APP_DB_PASSWORD:-apppass}@postgres:5432/${POSTGRES_DB:-lead_automation}
      GATEWAY_PUBLIC_URL: ${GATEWAY_PUBLIC_URL:-http://localhost:8080}
      GATEWAY_PORT: ${GATEWAY_PORT:-8080}
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["4016:4016"]
    volumes:
      - marketing_hub_uploads:/app/services/marketing-hub-service/public/uploads

  # E-commerce service - integrates with e-commerce platforms
  ecommerce-service:
    build:
      context: .
      dockerfile: services/ecommerce-service/Dockerfile
      network: host
    env_file: .env
    environment:
      DATABASE_URL: postgres://${APP_DB_USER:-app_user}:${APP_DB_PASSWORD:-apppass}@postgres:5432/${POSTGRES_DB:-lead_automation}
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["4006:4006"]

  # Review service - manages customer reviews and feedback
  review-service:
    build:
      context: .
      dockerfile: services/review-service/Dockerfile
      network: host
    env_file: .env
    environment:
      DATABASE_URL: postgres://${APP_DB_USER:-app_user}:${APP_DB_PASSWORD:-apppass}@postgres:5432/${POSTGRES_DB:-lead_automation}
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["4007:4007"]

  # Analytics service - provides business analytics and reporting
  analytics-service:
    build:
      context: .
      dockerfile: services/analytics-service/Dockerfile
      network: host
    container_name: analytics-service
    env_file: .env
    environment:
      DATABASE_URL: postgres://${APP_DB_USER:-app_user}:${APP_DB_PASSWORD:-apppass}@postgres:5432/${POSTGRES_DB:-lead_automation}
    depends_on:
      postgres: { condition: service_healthy }
    # Code listens on ANALYTICS_PORT||4008 (src/index.js) — the container's
    # real internal port, not 4007. Host port 4107 to avoid clashing with
    # review-service's 4007 on the host.
    ports: ["4107:4008"]

  # Integration service - manages third-party integrations
  integration-service:
    build:
      context: .
      dockerfile: services/integration-service/Dockerfile
      network: host
    container_name: integration-service
    env_file: .env
    environment:
      INTEGRATION_PORT: "4008"
      DATABASE_URL: postgres://${APP_DB_USER:-app_user}:${APP_DB_PASSWORD:-apppass}@postgres:5432/${POSTGRES_DB:-lead_automation}
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    ports: ["4008:4008"]

  # LinkedIn service - handles LinkedIn integration and API
  linkedin-service:
    build:
      context: .
      dockerfile: services/linkedin-service/Dockerfile
      network: host
    container_name: linkedin-service
    env_file: .env
    environment:
      PORT: "4009"
      DATABASE_URL:             postgres://${APP_DB_USER:-app_user}:${APP_DB_PASSWORD:-apppass}@postgres:5432/${POSTGRES_DB:-lead_automation}
      LINKEDIN_CLIENT_ID:       ${LINKEDIN_CLIENT_ID:-}
      LINKEDIN_CLIENT_SECRET:   ${LINKEDIN_CLIENT_SECRET:-}
      LINKEDIN_REDIRECT_URI:    ${LINKEDIN_REDIRECT_URI:-http://localhost:4009/api/v1/integrations/linkedin/callback}
      LINKEDIN_WEBHOOK_SECRET:  ${LINKEDIN_WEBHOOK_SECRET:-}
      # Where the OAuth callback redirects the browser back to (the actual
      # frontend page, not this service's own origin — see connection.js).
      FRONTEND_URL:             ${FRONTEND_URL:-http://localhost:3000}
      # Each LinkedIn Product is reviewed/approved independently — requesting
      # a scope for a Product that isn't approved gets the WHOLE auth request
      # rejected, so these are split rather than one all-or-nothing flag.
      # Advertising API + Lead Sync API + Conversions API share this tier.
      LINKEDIN_ADS_ACCESS:      ${LINKEDIN_ADS_ACCESS:-true}
      # Community Management API (post/read/react as an ORGANIZATION page) —
      # separate review from Ads; off until that Product is approved.
      LINKEDIN_ORG_ACCESS:      ${LINKEDIN_ORG_ACCESS:-false}
      LINKEDIN_API_VERSION:     ${LINKEDIN_API_VERSION:-202606}
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["4009:4009"]

  # Team service - manages team members and permissions
  team-service:
    build:
      context: .
      dockerfile: services/team-service/Dockerfile
      network: host
    env_file: .env
    environment:
      DATABASE_URL: postgres://${APP_DB_USER:-app_user}:${APP_DB_PASSWORD:-apppass}@postgres:5432/${POSTGRES_DB:-lead_automation}
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["4010:4010"]

  # Automation service - handles workflow automation
  automation-service:
    build:
      context: .
      dockerfile: services/automation-service/Dockerfile
      network: host
    env_file: .env
    environment:
      DATABASE_URL: postgres://${APP_DB_USER:-app_user}:${APP_DB_PASSWORD:-apppass}@postgres:5432/${POSTGRES_DB:-lead_automation}
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["4011:4011"]
    volumes:
      - automation_uploads:/app/services/automation-service/public/uploads

    # Notification service - handles email, SMS, and push notifications
  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
      network: host
    env_file: .env
    environment:
      DATABASE_URL: postgres://${APP_DB_USER:-app_user}:${APP_DB_PASSWORD:-apppass}@postgres:5432/${POSTGRES_DB:-lead_automation}
      # Container-to-container call the follow-up-due poller makes to pull
      # today's/overdue follow-ups — see src/followUpPoller.js.
      CONTACT_SERVICE_URL: http://contact-service:4003
    depends_on:
      postgres: { condition: service_healthy }
      contact-service: { condition: service_started }
    ports: ["4012:4012"]

  # Email service - Gmail integration (OAuth, sync, send/reply, attachments)
  email-service:
    build:
      context: .
      dockerfile: services/email-service/Dockerfile
      network: host
    container_name: email-service
    env_file: .env
    environment:
      EMAIL_PORT: "4013"
      DATABASE_URL: postgres://${APP_DB_USER:-app_user}:${APP_DB_PASSWORD:-apppass}@postgres:5432/${POSTGRES_DB:-lead_automation}
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["4013:4013"]
    # Persists cached Gmail attachment bytes (both downloaded-on-demand
    # inbound attachments and outgoing ones users compose with) across
    # container restarts — same local-disk caveat as automation_uploads /
    # auth_uploads: swap for S3/R2 before running >1 replica.
    volumes:
      - email_uploads:/app/services/email-service/public/uploads

  # Calendar service - Google Calendar integration (OAuth, meeting booking,
  # freebusy, campaign-send scheduling, automation delay-node scheduling)
  calendar-service:
    build:
      context: .
      dockerfile: services/calendar-service/Dockerfile
      network: host
    container_name: calendar-service
    env_file: .env
    environment:
      CALENDAR_PORT: "4014"
      DATABASE_URL: postgres://${APP_DB_USER:-app_user}:${APP_DB_PASSWORD:-apppass}@postgres:5432/${POSTGRES_DB:-lead_automation}
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["4014:4014"]

  # Inbox service - unified inbox for all communication channels
  inbox-service:
    build:
      context: .
      dockerfile: services/inbox-service/Dockerfile
      network: host
    container_name: inbox-service
    env_file: .env
    environment:
      INBOX_PORT: "4002"
      DATABASE_URL: postgres://${APP_DB_USER:-app_user}:${APP_DB_PASSWORD:-apppass}@postgres:5432/${POSTGRES_DB:-lead_automation}
      # So a reply to an email conversation can be forwarded to the service
      # that actually sends via Gmail -- see reply route in src/index.js.
      EMAIL_SERVICE_URL: http://email-service:4013
    depends_on:
      postgres: { condition: service_healthy }
    # Code reads INBOX_PORT (src/index.js), not PORT — 4002 is the real
    # internal port. Host port 4106 to avoid clashing with
    # ecommerce-service's 4006 on the host.
    ports: ["4106:4002"]

  # ─────────────────────────────────────────────
  # API Gateway
  # ─────────────────────────────────────────────

  # API Gateway - routes requests to appropriate microservices
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
      network: host
    env_file: .env
    environment:
      # These target names/ports match each service's own container_name
      # and internal PORT above — verified end-to-end this session; the
      # equivalent block on main had drifted (stale ports, pre-rename
      # ai-service, missing linkedin-service) and is superseded by this one.
      AUTH_SERVICE_URL:        http://auth-service:4001
      INBOX_SERVICE_URL:       http://inbox-service:4002
      CONTACT_SERVICE_URL:     http://contact-service:4003
      CAMPAIGN_SERVICE_URL:    http://campaign-service:4004
      AI_OVERVIEW_SERVICE_URL:    http://ai-overview-service:4020
      AI_MARKETING_SERVICE_URL:   http://ai-marketing-service:4021
      AI_SALES_SERVICE_URL:       http://ai-sales-service:4022
      AI_SUPPORT_SERVICE_URL:     http://ai-support-service:4023
      ECOMMERCE_SERVICE_URL:   http://ecommerce-service:4006
      REVIEW_SERVICE_URL:      http://review-service:4007
      ANALYTICS_SERVICE_URL:   http://analytics-service:4008
      INTEGRATION_SERVICE_URL: http://integration-service:4008
      LINKEDIN_SERVICE_URL:    http://linkedin-service:4009
      TEAM_SERVICE_URL:        http://team-service:4010
      AUTOMATION_SERVICE_URL:  http://automation-service:4011
      NOTIFICATION_SERVICE_URL: http://notification-service:4012
      EMAIL_SERVICE_URL:       http://email-service:4013
      CALENDAR_SERVICE_URL:    http://calendar-service:4014
      BILLING_SERVICE_URL:     http://billing-service:4015
      MARKETING_HUB_SERVICE_URL: http://marketing-hub-service:4016
    depends_on:
      - auth-service
      - inbox-service
      - contact-service
      - campaign-service
      - ai-overview-service
      - ai-marketing-service
      - ai-sales-service
      - ai-support-service
      - billing-service
      - marketing-hub-service
      - ecommerce-service
      - review-service
      - analytics-service
      - integration-service
      - linkedin-service
      - team-service
      - automation-service
      - notification-service
      - email-service
      - calendar-service
    ports: ["8080:8080"]

  # ─────────────────────────────────────────────
  # Frontend (Next.js 14)
  # ─────────────────────────────────────────────

  # Frontend - Next.js 14 application with landing page and dashboard
  frontend:
    build:
      context: ./frontend
      dockerfile: frontend.Dockerfile
      network: host
      args:
        # NEXT_PUBLIC_API_URL below is a *runtime* env var, but Next.js inlines
        # NEXT_PUBLIC_* at build time, so it must also be passed as a build arg.
        # See frontend.Dockerfile's matching ARG/ENV.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    container_name: frontend
    env_file: .env
    environment:
      # The browser-side API base URL — points at the gateway inside Docker.
      # Override with your public hostname in production.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
      # Force Next.js to use port 3000
      PORT: 3000
    depends_on:
      - api-gateway
    ports: ["3000:3000"]

volumes:
  pgdata:
  automation_uploads:
  auth_uploads:
  email_uploads:
  marketing_hub_uploads:
  ollama: